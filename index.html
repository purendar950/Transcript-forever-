<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020"><title>SSC Vocabulary AI</title>
<style>
:root{--bg:#080b14;--panel:#111727;--panel2:#171e31;--text:#f5f7fb;--muted:#9ca8bd;--accent:#7c5cff;--good:#32d583;--bad:#ff647c;--line:#273149;--shadow:0 18px 55px #0007}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#1b1640 0,#080b14 38%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:245px;background:#0b0f1b;border-right:1px solid var(--line);padding:22px 15px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:800;padding:8px 10px 22px}.brand span{color:#8b74ff}.nav{display:grid;gap:6px}.nav button{background:transparent;border:0;color:var(--muted);text-align:left;padding:12px 13px;border-radius:10px}.nav button.active,.nav button:hover{background:var(--panel2);color:white}.main{flex:1;max-width:1250px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.top h1{margin:0;font-size:28px}.badge{padding:7px 10px;background:#171d30;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(145deg,#12192a,#0f1524);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.stat b{font-size:28px;display:block;margin-top:7px}.muted{color:var(--muted)}.section{margin-top:22px}.section h2{font-size:18px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.quick button,.primary{border:0;border-radius:12px;padding:15px;background:var(--accent);color:white;font-weight:700}.quick button.secondary{background:var(--panel2);border:1px solid var(--line)}.flash{max-width:780px;margin:20px auto}.word{font-size:48px;font-weight:850;margin:10px 0}.pron{color:#a99cff}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:6px 9px;border-radius:999px;background:#1b2337;color:#c9d2e5;font-size:12px}.answer{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.actions button{border:1px solid var(--line);background:var(--panel2);color:white;padding:11px 16px;border-radius:10px}.actions .good{border-color:#226d4c;background:#123325}.actions .bad{border-color:#713040;background:#331722}.form{display:grid;gap:13px;max-width:800px}.form label{display:grid;gap:7px;color:var(--muted);font-size:13px}.form input,.form textarea,.form select{background:#0c1220;border:1px solid var(--line);color:white;border-radius:10px;padding:12px}.form textarea{min-height:120px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wordrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:#20283b}.hidden{display:none}.toast{position:fixed;right:18px;bottom:18px;background:#171f32;border:1px solid var(--line);padding:12px 15px;border-radius:10px;box-shadow:var(--shadow)}@media(max-width:800px){.side{width:68px;padding:12px 7px}.brand{font-size:0}.brand span{font-size:20px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:18px}.main{padding:18px}.grid{grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr}.two{grid-template-columns:1fr}.word{font-size:38px}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">SSC <span>Vocab AI</span></div><nav class="nav"><button data-page="dashboard" class="active">⌂ &nbsp; Dashboard</button><button data-page="learn">▣ &nbsp; Learn</button><button data-page="words">☷ &nbsp; My Words</button><button data-page="quiz">✓ &nbsp; Quiz</button><button data-page="settings">⚙ &nbsp; AI Settings</button></nav></aside><main class="main"><div id="page"></div></main></div><div id="toast" class="toast hidden"></div>
<script>
const defaultWords=[
 {w:'Guile',p:'/ɡaɪl/',pos:'noun',en:'Sly or cunning intelligence used to deceive or trick someone.',hi:'छल-कपट / चालाकी',syn:['cunning','deceit','craft'],ant:['honesty','sincerity'],story:'A GUY uses a guileful smile to trick everyone and steal the prize.',ex:'He relied on guile rather than force.',level:'New'},
 {w:'Abate',p:'/əˈbeɪt/',pos:'verb',en:'To become less strong, intense, or severe.',hi:'कम होना / घटाना',syn:['lessen','diminish','subside'],ant:['increase','intensify'],story:'A BEAR says: “I will ABATE the storm!” and the storm becomes weak.',ex:'The heavy rain began to abate.',level:'New'},
 {w:'Benevolent',p:'/bəˈnevələnt/',pos:'adjective',en:'Kind, generous and willing to help others.',hi:'दयालु / परोपकारी',syn:['kind','charitable','generous'],ant:['cruel','malevolent'],story:'BEN gives everyone a lovely gift: BEN + volunteer = benevolent.',ex:'The benevolent officer helped the poor.',level:'New'}
];
let state=JSON.parse(localStorage.sscVocab||'null')||{words:defaultWords,index:0,correct:0,wrong:0,streak:0,settings:{baseUrl:'https://api.openai.com/v1',apiKey:'',apiUser:'',model:'gpt-4o-mini'}};
const save=()=>localStorage.sscVocab=JSON.stringify(state); const toast=x=>{let t=document.getElementById('toast');t.textContent=x;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)};
function shell(html){document.getElementById('page').innerHTML=html}
function dashboard(){shell(`<div class="top"><div><div class="muted">SSC English</div><h1>Vocabulary Dashboard</h1></div><span class="badge">AI Flashcards</span></div><div class="grid"><div class="card stat"><span class="muted">Total words</span><b>${state.words.length}</b></div><div class="card stat"><span class="muted">Correct</span><b>${state.correct}</b></div><div class="card stat"><span class="muted">Needs revision</span><b>${state.wrong}</b></div><div class="card stat"><span class="muted">Streak</span><b>${state.streak} days</b></div></div><div class="section"><h2>Start learning</h2><div class="quick"><button onclick="go('learn')">Start Flashcards</button><button class="secondary" onclick="go('quiz')">Take SSC Quiz</button><button class="secondary" onclick="go('words')">Manage Vocabulary</button></div></div><div class="section card"><h2>Smart Memory System</h2><p class="muted">Each answer updates your revision priority. Wrong words return sooner; difficult words can be strengthened with new AI mnemonics.</p><div class="chips"><span class="chip">Active Recall</span><span class="chip">Spaced Repetition</span><span class="chip">Hindi + Hinglish</span><span class="chip">SSC-style MCQ</span><span class="chip">Confusion Words</span></div></div>`)}
function learn(){let x=state.words[state.index%state.words.length];shell(`<div class="top"><div><div class="muted">Flashcard ${state.index%state.words.length+1}/${state.words.length}</div><h1>Active Recall</h1></div><span class="badge">${x.level||'New'}</span></div><div class="flash card"><div class="muted">${x.pos||'word'}</div><div class="word">${x.w}</div><div class="pron">${x.p||''}</div><p class="muted">Before revealing: recall the meaning, synonym, antonym and a memory trick.</p><button class="primary" onclick="reveal()">Reveal Answer</button><div id="answer" class="answer hidden"><h3>Meaning</h3><p>${x.en}</p><h3>Hindi</h3><p>${x.hi}</p><h3>Memory Story</h3><p>${x.story}</p><h3>Synonyms</h3><div class="chips">${x.syn.map(a=>`<span class="chip">${a}</span>`).join('')}</div><h3>Antonyms</h3><div class="chips">${x.ant.map(a=>`<span class="chip">${a}</span>`).join('')}</div><h3>SSC-style sentence</h3><p>${x.ex}</p><div class="actions"><button class="bad" onclick="rate(false)">Again</button><button onclick="rate(true)">Difficult</button><button class="good" onclick="rate(true)">Got it</button></div></div></div>`)}
function reveal(){document.getElementById('answer').classList.remove('hidden')}
function rate(ok){if(ok){state.correct++;state.streak++;}else{state.wrong++;state.streak=0}state.index++;save();learn()}
function words(){shell(`<div class="top"><div><div class="muted">Vocabulary Bank</div><h1>My Words</h1></div></div><div class="card"><div class="form"><label>Add one or many words<textarea id="newWords" placeholder="abate\naberration\nbenevolent"></textarea></label><button class="primary" onclick="addWords()">Add Vocabulary</button></div></div><div class="section card">${state.words.map((x,i)=>`<div class="wordrow"><div><b>${x.w}</b><div class="muted">${x.hi} · ${x.en}</div></div><span class="pill">${x.level||'New'}</span></div>`).join('')}</div>`)}
function addWords(){let v=document.getElementById('newWords').value.trim();if(!v)return;v.split(/[,\n]+/).map(s=>s.trim()).filter(Boolean).forEach(w=>state.words.push({w,p:'',pos:'',en:'Meaning will be generated by AI.',hi:'AI Hindi meaning',syn:[],ant:[],story:'Generate an SSC memory story from AI Settings.',ex:'',level:'New'}));save();toast('Words added');words()}
function quiz(){let x=state.words[state.index%state.words.length];let opts=[x.en,...state.words.filter(a=>a!==x).slice(0,3).map(a=>a.en)].sort(()=>Math.random()-.5);shell(`<div class="top"><div><div class="muted">SSC Practice</div><h1>Meaning MCQ</h1></div><span class="badge">1 question</span></div><div class="card flash"><h2>What does <b>${x.w}</b> mean?</h2>${opts.map((o,i)=>`<button class="actions" style="width:100%;margin:8px 0;text-align:left" onclick="quizAnswer(this,${o===x.en})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>`)}
function quizAnswer(btn,ok){btn.style.borderColor=ok?'#32d583':'#ff647c';toast(ok?'Correct!':'Incorrect — revise this word.');if(ok)state.correct++;else state.wrong++;save()}
function settings(){let s=state.settings;shell(`<div class="top"><div><div class="muted">Provider</div><h1>AI Configuration</h1></div><span class="badge">Stored locally</span></div><div class="card form"><label>Base URL<input id="base" value="${s.baseUrl}"></label><div class="two"><label>API User<input id="user" value="${s.apiUser}"></label><label>Model<input id="model" value="${s.model}"></label></div><label>API Key<input id="key" type="password" value="${s.apiKey}" placeholder="Your API key"></label><button class="primary" onclick="saveSettings()">Save Configuration</button><button onclick="testAI()" style="background:#171e31;color:white;border:1px solid #273149;padding:12px;border-radius:10px">Test Connection</button><p class="muted">Supports OpenAI-compatible endpoints. The key is kept in this browser's local storage; never commit it to GitHub.</p></div>`)}
function saveSettings(){state.settings={baseUrl:document.getElementById('base').value.trim().replace(/\/$/,''),apiUser:document.getElementById('user').value,model:document.getElementById('model').value,apiKey:document.getElementById('key').value};save();toast('AI configuration saved')}
async function testAI(){saveSettings();let s=state.settings;if(!s.apiKey){toast('Enter an API key first');return}try{let r=await fetch(s.baseUrl+'/models',{headers:{Authorization:'Bearer '+s.apiKey,...(s.apiUser?{'X-API-User':s.apiUser}:{})}});toast(r.ok?'Connection successful':'Connection returned '+r.status)}catch(e){toast('Connection failed — check Base URL/CORS') }}
function go(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));({dashboard,learn,words,quiz,settings}[p]||dashboard)()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));go('dashboard');
</script></body></html>
